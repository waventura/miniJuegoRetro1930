<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>¡Aventura Retro 1930! — Minijuegos para Carlos, Mateo y Ariel</title>
  <meta name="description" content="Colección de 6 minijuegos rápidos de acción y puntería estilo Caricatura Clásica 1930 (Rubber Hose a color a 12 fps) para Carlos, Mateo y Ariel." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Escenario de Minijuego Activo -->
  <main class="stage-wrap">
    <canvas id="gameCanvas" width="1340" height="800" aria-label="Escenario de Minijuego Retro 1930"></canvas>

    <header id="playHud" class="play-hud hidden">
      <div class="hud-row">
        <button id="btnBackHub" class="icon-btn" title="Volver a Minijuegos">🎪 Menú</button>
        <div id="hudGameTitle" class="hud-pill">🔨 ¡Aplastatopos 1930!</div>
      </div>

      <div class="hud-row">
        <div id="hudCombo" class="hud-pill combo hidden">🔥 x3</div>
        <div id="hudScore" class="hud-pill">⭐ 0</div>
        <div id="hudTimer" class="hud-pill timer">⏱️ 45s</div>
      </div>
    </header>
  </main>

  <!-- Menú Principal de Colección de 6 Minijuegos Retro 1930 -->
  <section id="hubScreen" class="hub-screen">
    <header class="hub-top">
      <div class="hub-brand">
        <h1>🎪 ¡Minijuegos Retro 1930!</h1>
        <p>Elige a tu personaje y toca cualquier minijuego para empezar <b id="versionLabel">v1.1.0</b></p>
      </div>

      <div class="hero-selector" aria-label="Elegir personaje">
        <div class="hero-chip selected" data-char="carlos">
          <canvas id="chipCarlos" width="112" height="112"></canvas>
          <span>Carlos</span>
        </div>
        <div class="hero-chip" data-char="mateo">
          <canvas id="chipMateo" width="112" height="112"></canvas>
          <span>Mateo</span>
        </div>
        <div class="hero-chip" data-char="ariel">
          <canvas id="chipAriel" width="112" height="112"></canvas>
          <span>Ariel</span>
        </div>
      </div>

      <div class="hub-actions">
        <div id="totalStars" class="star-counter">⭐ 0 / 18</div>
        <button id="btnSoundHub" class="icon-btn" title="Música y Sonidos">🔊</button>
        <button id="btnVoiceHub" class="icon-btn" title="Voz Latina">🗣️</button>
        <button id="btnOpenUpdate" class="icon-btn" title="Buscar Actualización">
          ⬇️<span id="updateDot" class="update-dot hidden"></span>
        </button>
      </div>
    </header>

    <div id="gamesGrid" class="games-grid"></div>
  </section>

  <!-- Modal de Resultado de Minijuego -->
  <div id="resultModal" class="modal-backdrop hidden">
    <div class="retro-modal">
      <h2 id="resultTitle">🎉 ¡Muy bien!</h2>
      <div id="resultStars" class="result-stars">⭐⭐⭐</div>
      <div id="resultScore" class="result-score">320 puntos</div>
      <div id="resultBest" class="result-best">Mejor récord: 320 pts</div>
      <div class="btn-row">
        <button id="btnReplay" class="retro-btn">🔄 ¡Jugar Otra Vez!</button>
        <button id="btnResultHub" class="retro-btn alt">🎪 Más Minijuegos</button>
      </div>
    </div>
  </div>

  <!-- Modal de Actualización -->
  <div id="updateModal" class="modal-backdrop hidden">
    <div class="retro-modal">
      <h2>⬇️ Actualización</h2>
      <p id="updateStatus" style="font-weight:800; font-size:17px;"></p>
      <div id="updateNotes" class="update-notes"></div>
      <div class="btn-row">
        <button id="btnCheckNow" class="retro-btn alt">🔄 Buscar</button>
        <button id="btnDownloadUpdate" class="retro-btn hidden">📲 Descargar APK</button>
        <button id="btnCloseUpdate" class="retro-btn alt">✕ Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
